[package]
name = "fsapp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Operational CLI (fsapp) and config CLI (fset) for copy/mv/sync/watch/compress, backed by file-engine"

[[bin]]
name = "fsapp"
path = "src/main.rs"

[[bin]]
name = "fset"
path = "src/bin/fset/main.rs"

[dependencies]
fs-config = { path = "../fs-config" }
file-engine = { version = "2.0.0", features = ["sync", "watch", "compress", "checksum", "permissions"] }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
colored = "2"
# Update check only. `default-features = false` drops gzip — one small JSON
# response per day doesn't need it — and `rustls` keeps TLS in-process so
# the musl target and the .deb stay free of a system OpenSSL dependency.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
semver = "1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "Eduardo Moya"
copyright = "2026, Eduardo Moya"
section = "utils"
priority = "optional"
assets = [
    ["target/release/fsapp", "usr/bin/", "755"],
    ["target/release/fset", "usr/bin/", "755"],
]
