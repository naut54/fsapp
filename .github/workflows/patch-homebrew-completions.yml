# Closes axodotdev/cargo-dist#2429 ourselves: dist's Homebrew template
# dumps completions into `pkgshare` inert, since it never calls
# Homebrew's own `generate_completions_from_executable`. This job runs
# after `publish-homebrew-formula` has already committed this release's
# formula to the tap (dist wires `post-announce-jobs` to run after
# `announce`, which itself only succeeds once that commit landed — see
# dist-workspace.toml and docs/completions-design.md §4.2/§8), and
# patches the freshly-committed formula in place to activate them.
#
# Not autogenerated by dist — unlike release.yml, this file is ours to
# maintain. If `dist generate` ever changes the Homebrew template such
# that `install_binary_aliases!` (the anchor line below) no longer
# appears verbatim in `def install`, this job fails loudly instead of
# silently shipping a formula with inert completions again.
name: Patch Homebrew formula for completions

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  patch:
    runs-on: "ubuntu-22.04"
    env:
      PLAN: ${{ inputs.plan }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease || fromJson(inputs.plan).publish_prereleases }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          repository: "naut54/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Activate completions in the freshly-published formula
        run: |
          set -euo pipefail
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            formula="Formula/${filename}"

            if [ ! -f "$formula" ]; then
              echo "::error::${formula} not found — publish-homebrew-formula should have committed it before this job ran" >&2
              exit 1
            fi
            if grep -q 'generate_completions_from_executable' "$formula"; then
              echo "${formula} already activates completions; nothing to do"
              continue
            fi
            if ! grep -q '^    install_binary_aliases!$' "$formula"; then
              echo "::error::${formula} has no 'install_binary_aliases!' line to anchor the patch on — dist's Homebrew template may have changed. See .github/workflows/patch-homebrew-completions.yml" >&2
              exit 1
            fi

            perl -0pi -e 's/^(    install_binary_aliases!\n)/$1\n    generate_completions_from_executable(bin\/"fsapp", "completions")\n    generate_completions_from_executable(bin\/"fset", "completions")\n/m' "$formula"

            git add "$formula"
            git commit -m "${filename%.rb}: activate shell completions"
          done

          git push
