# §10.2 of fsapp-design-spec.md: lightweight .deb packaging, no self-hosted
# apt repository. Deliberately a separate workflow from release.yml (which
# is fully owned/self-checked by `dist generate` — see .github/workflows/
# release.yml's header) rather than a hand-added job inside it, so `dist`'s
# own CI consistency check never conflicts with this.
#
# Triggers on the "Release" workflow *completing*, not on `release:
# published` — GitHub Actions does not fire repo events (including
# `release: published`) for a release created using the default
# GITHUB_TOKEN, which is exactly what dist's `host` job uses. `workflow_run`
# is exempt from that restriction, so it's the reliable way to run after
# dist has already created the GitHub Release these .debs upload to.
name: Build and attach .deb packages

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach .debs to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-deb:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb package
        # fset is a second [[bin]] in the fsapp package (not a separate
        # crate — see §1/§2 of fsapp-design-spec.md), so one `cargo deb`
        # run produces one .deb containing both binaries.
        run: cargo deb -p fsapp
      - name: Upload .debs to the release
        run: gh release upload "${{ steps.tag.outputs.tag }}" target/debian/*.deb --clobber
