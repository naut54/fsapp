[package]
name = "fset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Config CLI for reading/writing fsapp's shared JSON config file"

[[bin]]
name = "fset"
path = "src/main.rs"

[dependencies]
fs-config = { path = "../fs-config" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = "1"
serde_json = "1"
is-terminal = "0.4"

[package.metadata.deb]
maintainer = "Eduardo Moya"
copyright = "2026, Eduardo Moya"
section = "utils"
priority = "optional"
assets = [["target/release/fset", "usr/bin/", "755"]]
